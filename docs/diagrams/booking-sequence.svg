<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.label{font-size:15px}.head{font-size:17px;font-weight:700}.lifeline{stroke:#94a3b8;stroke-dasharray:7 5}.msg{stroke:#334155;stroke-width:2;marker-end:url(#a)}.return{stroke:#64748b;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#a)}.box{fill:#edf4ff;stroke:#2563eb;stroke-width:2}.alt{fill:#f8fafc;stroke:#64748b;stroke-width:2}</style>
 <text x="500" y="35" text-anchor="middle" class="title">Customer Ticket Booking Sequence</text>
 <g class="box"><rect x="60" y="65" width="150" height="48" rx="8"/><rect x="290" y="65" width="150" height="48" rx="8"/><rect x="520" y="65" width="150" height="48" rx="8"/><rect x="780" y="65" width="150" height="48" rx="8"/></g><g text-anchor="middle" class="head"><text x="135" y="95">Customer</text><text x="365" y="95">Web client</text><text x="595" y="95">Booking API</text><text x="855" y="95">Data store</text></g><g class="lifeline"><path d="M135 113V620M365 113V620M595 113V620M855 113V620"/></g>
 <path d="M135 160H365M365 220H595M595 280H855" class="msg"/><text x="250" y="150" class="label">1. Choose quantity and confirm</text><text x="470" y="210" class="label">2. POST /api/bookings</text><text x="690" y="270" class="label">3. Retrieve event capacity</text>
 <path d="M855 320H595" class="return"/><text x="690" y="310" class="label">4. capacity and booked count</text>
 <rect x="485" y="350" width="410" height="220" class="alt"/><text x="498" y="373" class="head">alt</text><text x="540" y="373" class="label">tickets available</text><path d="M595 410H855" class="msg"/><text x="690" y="400" class="label">5. Save booking; increment booked</text><path d="M855 450H595M595 495H365M365 535H135" class="return"/><text x="690" y="440" class="label">6. Booking ID</text><text x="480" y="485" class="label">7. 201 confirmation</text><text x="250" y="525" class="label">8. Success state and total</text><path d="M485 575H895" stroke="#64748b"/><text x="540" y="602" class="head">else</text><text x="585" y="602" class="label">insufficient tickets → 400 validation error</text>
