<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title description">
  <title id="title">EventBook detailed customer ticket booking sequence diagram</title>
  <desc id="description">Customer ticket booking sequence from discovery through customer role authorisation, validation, capacity protection, persistence and confirmation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#526581}.head{font-size:15px;font-weight:700}.label{font-size:11.5px}.small{font-size:10.8px;fill:#526581}.box{fill:#f7faff;stroke:#3f6fbe;stroke-width:2}.life{stroke:#93a4bc;stroke-width:1.5;stroke-dasharray:7 6}.call{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#arrow)}.return{fill:none;stroke:#64748b;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#arrow)}.alt{fill:#fbfdff;stroke:#7f9ac8;stroke-width:1.5}.note{fill:#fff8e5;stroke:#ca8a04;stroke-width:1.5}
    </style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="title">EventBook — Detailed Customer Ticket Booking Sequence</text>
  <text x="600" y="61" text-anchor="middle" class="sub">The API, not the browser, is authoritative for role, quantity and capacity checks</text>
  <g class="box"><rect x="28" y="95" width="145" height="54" rx="10"/><rect x="250" y="95" width="180" height="54" rx="10"/><rect x="505" y="95" width="170" height="54" rx="10"/><rect x="750" y="95" width="185" height="54" rx="10"/><rect x="1010" y="95" width="150" height="54" rx="10"/></g>
  <g text-anchor="middle"><text x="100" y="128" class="head">Customer</text><text x="340" y="128" class="head">Web client</text><text x="590" y="128" class="head">Booking API</text><text x="842" y="128" class="head">Session + validation</text><text x="1085" y="128" class="head">data.json</text></g>
  <path d="M100 149V1185M340 149V1185M590 149V1185M842 149V1185M1085 149V1185" class="life"/>
  <path d="M100 200H340" class="call"/><text x="220" y="188" text-anchor="middle" class="label">1. Browse/search events; select event</text>
  <path d="M340 245H590" class="call"/><text x="465" y="233" text-anchor="middle" class="label">2. GET /api/events?q=&amp;sort=</text>
  <path d="M590 290H1085" class="call"/><text x="838" y="278" text-anchor="middle" class="label">3. Read events and booked counts</text>
  <path d="M1085 327H590" class="return"/><text x="838" y="315" text-anchor="middle" class="label">4. Event records</text>
  <path d="M590 364H340" class="return"/><text x="465" y="352" text-anchor="middle" class="label">5. Event list + remaining capacity</text>
  <path d="M340 401H100" class="return"/><text x="220" y="389" text-anchor="middle" class="label">6. Details and Buy Tickets action</text>
  <path d="M100 450H340" class="call"/><text x="220" y="438" text-anchor="middle" class="label">7. Choose quantity; submit demo checkout</text>
  <rect x="225" y="470" width="310" height="56" rx="8" class="note"/><text x="245" y="495" class="head">Browser-only payment input</text><text x="245" y="515" class="small">Visible total is calculated locally; card fields are not sent.</text>
  <path d="M340 565H590" class="call"/><text x="465" y="553" text-anchor="middle" class="label">8. POST /api/bookings(eventId, quantity)</text>
  <path d="M590 610H842" class="call"/><text x="716" y="598" text-anchor="middle" class="label">9. Resolve session; require customer role</text>
  <rect x="470" y="640" width="650" height="430" rx="12" class="alt"/><text x="490" y="667" class="head">alt — authorisation and validation outcome</text>
  <path d="M842 705H590" class="return"/><text x="716" y="693" text-anchor="middle" class="label">[no valid customer session] unauthorised</text>
  <path d="M590 742H340" class="return"/><text x="465" y="730" text-anchor="middle" class="label">10a. 401 — prompt login</text>
  <path d="M340 779H100" class="return"/><text x="220" y="767" text-anchor="middle" class="label">11a. Inline error / login entry point</text>
  <path d="M842 825H590" class="return"/><text x="716" y="813" text-anchor="middle" class="label">[authorised] session user</text>
  <path d="M590 862H842" class="call"/><text x="716" y="850" text-anchor="middle" class="label">10b. Validate positive whole quantity</text>
  <path d="M842 899H590" class="return"/><text x="716" y="887" text-anchor="middle" class="label">[invalid] quantity error → 400 response</text>
  <path d="M590 938H1085" class="call"/><text x="838" y="926" text-anchor="middle" class="label">[valid] 10c. Read target event capacity, booked count and price</text>
  <path d="M1085 975H590" class="return"/><text x="838" y="963" text-anchor="middle" class="label">11c. Event record</text>
  <path d="M590 1012H842" class="call"/><text x="716" y="1000" text-anchor="middle" class="label">12. Check booked + quantity ≤ capacity</text>
  <path d="M842 1049H590" class="return"/><text x="716" y="1037" text-anchor="middle" class="label">[insufficient] reject; [available] accept</text>
  <rect x="470" y="1100" width="650" height="86" rx="10" class="alt"/>
  <text x="492" y="1128" class="head">Success path when capacity is available</text>
  <text x="492" y="1152" class="label">13. API increments Event.booked and appends a Confirmed Booking to data.json.</text>
  <text x="492" y="1173" class="label">14. API returns 201 with booking ID, total and status; 15. client renders the receipt.</text>
</svg>
