<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1230" viewBox="0 0 1500 1230" role="img" aria-labelledby="title description">
  <title id="title">EventBook detailed SysML block definition diagram</title>
  <desc id="description">Detailed EventBook system blocks covering WebClient, browser storage, API services, sessions, validation, booking service and persistent Event and Booking entities.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526581"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
      .title { font-size: 28px; font-weight: 700; }
      .sub { font-size: 15px; fill: #526581; }
      .layer { fill: #f8fbff; stroke: #b0c7eb; stroke-width: 2; }
      .presentation { fill: #eef5ff; stroke: #2563eb; stroke-width: 2; }
      .service { fill: #f4f7fc; stroke: #3f6fbe; stroke-width: 2; }
      .store { fill: #effcf8; stroke: #0f766e; stroke-width: 2; }
      .note { fill: #fff8e5; stroke: #ca8a04; stroke-width: 1.7; }
      .heading { font-size: 17px; font-weight: 700; }
      .field { font-size: 13px; }
      .small { font-size: 12px; fill: #526581; }
      .line { fill: none; stroke: #526581; stroke-width: 2; marker-end: url(#arrow); }
      .assoc { fill: none; stroke: #526581; stroke-width: 1.8; }
    </style>
  </defs>
  <text x="750" y="38" text-anchor="middle" class="title">SysML Block Definition Diagram — EventBook</text>
  <text x="750" y="64" text-anchor="middle" class="sub">Logical blocks, responsibilities, data entities and important integrity constraints</text>

  <rect x="30" y="90" width="1440" height="92" rx="16" class="layer"/>
  <text x="55" y="122" class="heading">EventBookSystem : block</text>
  <text x="55" y="148" class="field">Responsibilities: serve static client · route API requests · send JSON responses · expose health endpoint</text>
  <text x="55" y="170" class="small">Composition: WebClient, BrowserLocalStore, HttpApiServer and JsonRepository. Payment card data is deliberately outside the server/system boundary.</text>

  <!-- Presentation -->
  <rect x="30" y="205" width="1440" height="214" rx="16" class="layer"/>
  <text x="55" y="236" class="heading">Presentation layer</text>
  <rect x="95" y="266" width="620" height="125" rx="11" class="presentation"/>
  <text x="405" y="296" text-anchor="middle" class="heading">WebClient : block</text>
  <text x="120" y="324" class="field">state: user · token · events · filters · favourites</text>
  <text x="120" y="347" class="field">renderHome() · renderEventDetails() · renderCheckout()</text>
  <text x="120" y="370" class="field">renderBookings() · renderAdminDashboard() · callApi()</text>
  <rect x="820" y="266" width="570" height="125" rx="11" class="presentation"/>
  <text x="1105" y="296" text-anchor="middle" class="heading">BrowserLocalStore : block</text>
  <text x="845" y="324" class="field">favourites : Set&lt;EventId&gt; · user : DemoUser · token : Token</text>
  <text x="845" y="347" class="field">saveSession() · saveFavourites() · readStoredJson()</text>
  <text x="845" y="370" class="small">Local session/favourites only; no payment data is retained.</text>
  <path d="M715 328H820" class="line"/><text x="766" y="316" text-anchor="middle" class="small">stores locally</text>

  <!-- Application -->
  <rect x="30" y="444" width="1440" height="362" rx="16" class="layer"/>
  <text x="55" y="475" class="heading">Application layer</text>
  <rect x="75" y="510" width="390" height="244" rx="11" class="service"/>
  <text x="270" y="541" text-anchor="middle" class="heading">HttpApiServer : block</text>
  <text x="100" y="570" class="field">GET /api/health · GET /api/events?q&amp;sort</text>
  <text x="100" y="593" class="field">GET /api/events/:id · POST /api/login/logout</text>
  <text x="100" y="616" class="field">GET/POST /api/bookings · POST cancel</text>
  <text x="100" y="639" class="field">POST/PUT /api/events</text>
  <text x="100" y="670" class="small">Routes HTTP request to protected application operations.</text>
  <rect x="530" y="510" width="350" height="244" rx="11" class="service"/>
  <text x="705" y="541" text-anchor="middle" class="heading">SessionManager : block</text>
  <text x="555" y="570" class="field">sessions : Map&lt;Token, DemoUser&gt;</text>
  <text x="555" y="595" class="field">getAuthenticatedUser(token)</text>
  <text x="555" y="620" class="field">requireRole(user, role)</text>
  <text x="555" y="645" class="field">revokeSession(token)</text>
  <text x="555" y="682" class="small">Demo sessions are intentionally in memory.</text>
  <rect x="945" y="510" width="470" height="244" rx="11" class="service"/>
  <text x="1180" y="535" text-anchor="middle" class="heading">ValidationService +</text>
  <text x="1180" y="557" text-anchor="middle" class="heading">BookingService : blocks</text>
  <text x="970" y="587" class="field">validEvent(eventData) · validate whole quantity</text>
  <text x="970" y="612" class="field">getRemainingTickets(event) · validate capacity</text>
  <text x="970" y="637" class="field">createBooking(database, user, eventId, quantity)</text>
  <text x="970" y="662" class="field">restore capacity after eligible cancellation</text>
  <text x="970" y="700" class="small">Authorisation and integrity checks occur before a repository write.</text>
  <path d="M405 391V510M465 610H530M880 610H945" class="line"/>
  <text x="440" y="458" class="small">JSON/HTTP + Bearer token</text><text x="472" y="595" class="small">session</text><text x="888" y="595" class="small">authorise/validate</text>

  <!-- Persistence -->
  <rect x="30" y="830" width="1440" height="298" rx="16" class="layer"/>
  <text x="55" y="862" class="heading">Persistence layer</text>
  <rect x="75" y="900" width="310" height="180" rx="11" class="store"/>
  <text x="230" y="932" text-anchor="middle" class="heading">JsonRepository : block</text>
  <text x="100" y="963" class="field">filePath : data.json</text>
  <text x="100" y="988" class="field">readDatabase()</text>
  <text x="100" y="1013" class="field">writeDatabase(database)</text>
  <text x="100" y="1045" class="small">Persists Event and Booking collections.</text>
  <rect x="490" y="890" width="400" height="200" rx="11" class="store"/>
  <text x="690" y="922" text-anchor="middle" class="heading">Event [0..*] : block</text>
  <text x="515" y="954" class="field">id · title · date · time · venue · price</text>
  <text x="515" y="980" class="field">capacity · booked · description</text>
  <text x="515" y="1010" class="field">derived: remaining = capacity − booked</text>
  <text x="515" y="1044" class="small">Published event record used by discovery and checkout.</text>
  <rect x="1000" y="890" width="400" height="200" rx="11" class="store"/>
  <text x="1200" y="922" text-anchor="middle" class="heading">Booking [0..*] : block</text>
  <text x="1025" y="954" class="field">id · eventId · email · customer · quantity</text>
  <text x="1025" y="980" class="field">total · status · createdAt</text>
  <text x="1025" y="1010" class="field">status: Confirmed | Cancelled</text>
  <text x="1025" y="1044" class="small">eventId references exactly one Event.</text>
  <path d="M1180 754V830H230V900M385 990H490M890 990H1000" class="line"/>
  <text x="470" y="816" class="small">read/write</text><text x="425" y="976" class="small">contains</text><text x="945" y="976" class="small">contains</text>

  <rect x="290" y="1150" width="920" height="52" rx="10" class="note"/>
  <text x="750" y="1174" text-anchor="middle" class="heading">Integrity constraint</text>
  <text x="750" y="1193" text-anchor="middle" class="small">A booking is persisted only after customer-role authorisation, whole-quantity validation and capacity validation. Cancellation restores capacity; payment fields never reach the API.</text>
</svg>
