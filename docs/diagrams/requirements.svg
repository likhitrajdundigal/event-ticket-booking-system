<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.id{font-size:17px;font-weight:700}.txt{font-size:14px}.box{fill:#f8fafc;stroke:#2563eb;stroke-width:2}</style><text x="500" y="37" text-anchor="middle" class="title">EventBook Requirements Diagram</text><g class="box"><rect x="60" y="80" width="400" height="120" rx="10"/><rect x="540" y="80" width="400" height="120" rx="10"/><rect x="60" y="245" width="400" height="120" rx="10"/><rect x="540" y="245" width="400" height="120" rx="10"/><rect x="60" y="410" width="400" height="120" rx="10"/><rect x="540" y="410" width="400" height="120" rx="10"/></g><g><text x="85" y="112" class="id">R-01 Role-based access</text><text x="85" y="143" class="txt">Separate customer and administrator</text><text x="85" y="164" class="txt">capabilities after authentication.</text><text x="565" y="112" class="id">R-02 Event information</text><text x="565" y="143" class="txt">Display event detail and remaining</text><text x="565" y="164" class="txt">ticket capacity.</text><text x="85" y="277" class="id">R-03 Valid booking quantity</text><text x="85" y="308" class="txt">Create bookings only for positive,</text><text x="85" y="329" class="txt">whole ticket quantities.</text><text x="565" y="277" class="id">R-04 Capacity protection</text><text x="565" y="308" class="txt">Reject bookings that exceed remaining</text><text x="565" y="329" class="txt">event capacity.</text><text x="85" y="442" class="id">R-05 Validated event creation</text><text x="85" y="473" class="txt">Allow administrators to create</text><text x="85" y="494" class="txt">validated events.</text><text x="565" y="442" class="id">R-06 Persistent records</text><text x="565" y="473" class="txt">Persist events and bookings across</text><text x="565" y="494" class="txt">server restarts.</text></g></svg>
