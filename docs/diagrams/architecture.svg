<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530">
 <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.heading{font-size:20px;font-weight:700}.label{font-size:15px}.box{stroke:#2563eb;stroke-width:2;fill:#edf4ff}.data{stroke:#0f766e;stroke-width:2;fill:#ecfdf5}.line{stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.note{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}</style>
 <text x="500" y="38" text-anchor="middle" class="title">EventBook Logical Architecture</text>
 <rect x="60" y="160" width="230" height="180" rx="14" class="box"/><text x="175" y="205" text-anchor="middle" class="heading">Web client</text><text x="175" y="240" text-anchor="middle" class="label">HTML / CSS / JavaScript</text><text x="175" y="270" text-anchor="middle" class="label">Screens, forms and alerts</text><text x="175" y="300" text-anchor="middle" class="label">Customer and admin UI</text>
 <rect x="385" y="130" width="255" height="240" rx="14" class="box"/><text x="512" y="178" text-anchor="middle" class="heading">Application server</text><text x="512" y="215" text-anchor="middle" class="label">Node.js HTTP API</text><text x="512" y="246" text-anchor="middle" class="label">Authentication / role access</text><text x="512" y="277" text-anchor="middle" class="label">Input and capacity validation</text><text x="512" y="308" text-anchor="middle" class="label">Booking and event operations</text>
 <rect x="735" y="160" width="205" height="180" rx="14" class="data"/><text x="837" y="205" text-anchor="middle" class="heading">Data store</text><text x="837" y="240" text-anchor="middle" class="label">data.json</text><text x="837" y="270" text-anchor="middle" class="label">Events</text><text x="837" y="300" text-anchor="middle" class="label">Bookings</text>
 <path d="M290 250H385M640 250H735" class="line"/><text x="337" y="232" text-anchor="middle" class="label">JSON / HTTP</text><text x="690" y="232" text-anchor="middle" class="label">read / write</text>
 <rect x="335" y="410" width="355" height="68" rx="10" class="note"/><text x="512" y="438" text-anchor="middle" class="label">Server-side validation prevents invalid and</text><text x="512" y="460" text-anchor="middle" class="label">over-capacity bookings from being saved.</text>
</svg>
