<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title description">
  <title id="title">EventBook detailed use-case diagram</title>
  <desc id="description">Customer and administrator interactions with EventBook, including shared authorisation, validation and persistence use cases.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526581"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#526581}.boundary{fill:#f8fbff;stroke:#86a9e4;stroke-width:2}.use{fill:#fff;stroke:#3f6fbe;stroke-width:2}.internal{fill:#f1f7ff;stroke:#2563eb;stroke-width:2}.note{fill:#fff8e5;stroke:#ca8a04;stroke-width:1.5}.actor{stroke:#172b4d;stroke-width:2.3;fill:none}.head{font-size:15.5px;font-weight:700}.label{font-size:12.5px}.small{font-size:11px;fill:#526581}.line{fill:none;stroke:#526581;stroke-width:1.7}.include{fill:none;stroke:#526581;stroke-width:1.6;stroke-dasharray:7 5;marker-end:url(#arr)}
    </style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="title">EventBook — Detailed Use-Case Diagram</text>
  <text x="600" y="61" text-anchor="middle" class="sub">Customer and administrator capabilities, with shared authorisation, validation and persistence behaviour</text>
  <rect x="170" y="92" width="995" height="850" rx="18" class="boundary"/>
  <text x="668" y="122" text-anchor="middle" class="head">EventBook system boundary</text>
  <g class="actor"><circle cx="82" cy="310" r="20"/><path d="M82 330V395M48 355H116M82 395L53 438M82 395L111 438"/><circle cx="82" cy="675" r="20"/><path d="M82 695V760M48 720H116M82 760L53 803M82 760L111 803"/></g>
  <text x="82" y="466" text-anchor="middle" class="head">Customer</text><text x="82" y="832" text-anchor="middle" class="head">Administrator</text>
  <ellipse cx="400" cy="175" rx="145" ry="38" class="use"/><text x="400" y="171" text-anchor="middle" class="head">Authenticate</text><text x="400" y="191" text-anchor="middle" class="label">with a demo account</text>
  <ellipse cx="400" cy="285" rx="145" ry="42" class="use"/><text x="400" y="278" text-anchor="middle" class="head">Browse, search and sort</text><text x="400" y="299" text-anchor="middle" class="label">events and availability</text>
  <ellipse cx="400" cy="400" rx="145" ry="42" class="use"/><text x="400" y="393" text-anchor="middle" class="head">Save / remove favourite</text><text x="400" y="414" text-anchor="middle" class="label">in browser local storage</text>
  <ellipse cx="400" cy="515" rx="145" ry="42" class="use"/><text x="400" y="508" text-anchor="middle" class="head">Inspect event details</text><text x="400" y="529" text-anchor="middle" class="label">and remaining tickets</text>
  <ellipse cx="400" cy="630" rx="145" ry="42" class="use"/><text x="400" y="623" text-anchor="middle" class="head">Complete simulated checkout</text><text x="400" y="644" text-anchor="middle" class="label">and receive confirmation</text>
  <ellipse cx="690" cy="340" rx="145" ry="42" class="use"/><text x="690" y="333" text-anchor="middle" class="head">View admin dashboard</text><text x="690" y="354" text-anchor="middle" class="label">metrics and all bookings</text>
  <ellipse cx="690" cy="465" rx="145" ry="42" class="use"/><text x="690" y="458" text-anchor="middle" class="head">Create / edit event</text><text x="690" y="479" text-anchor="middle" class="label">details, price and capacity</text>
  <ellipse cx="690" cy="590" rx="145" ry="42" class="use"/><text x="690" y="583" text-anchor="middle" class="head">View / cancel booking</text><text x="690" y="604" text-anchor="middle" class="label">own or eligible customer booking</text>
  <rect x="930" y="155" width="190" height="66" rx="33" class="internal"/><text x="1025" y="181" text-anchor="middle" class="head">Authorise role</text><text x="1025" y="201" text-anchor="middle" class="small">session + permissions</text>
  <rect x="930" y="315" width="190" height="66" rx="33" class="internal"/><text x="1025" y="341" text-anchor="middle" class="head">Validate input</text><text x="1025" y="361" text-anchor="middle" class="small">event data + quantity</text>
  <rect x="930" y="475" width="190" height="66" rx="33" class="internal"/><text x="1025" y="501" text-anchor="middle" class="head">Validate capacity</text><text x="1025" y="521" text-anchor="middle" class="small">requested ≤ remaining</text>
  <rect x="930" y="635" width="190" height="66" rx="33" class="internal"/><text x="1025" y="661" text-anchor="middle" class="head">Persist records</text><text x="1025" y="681" text-anchor="middle" class="small">write data.json safely</text>
  <path d="M116 310L255 175M116 330L255 285M116 350L255 400M116 370L255 515M116 390L255 630" class="line"/>
  <path d="M116 675L255 175M116 700L545 340M116 725L545 465M116 750L545 590" class="line"/>
  <path d="M545 630H875V188H930" class="include"/><text x="690" y="620" class="small">&lt;&lt;include&gt;&gt;</text>
  <path d="M545 630H850V348H930" class="include"/><text x="700" y="648" class="small">&lt;&lt;include&gt;&gt;</text>
  <path d="M545 630H825V508H930" class="include"/><text x="700" y="668" class="small">&lt;&lt;include&gt;&gt;</text>
  <path d="M545 630H805V668H930" class="include"/><text x="700" y="688" class="small">&lt;&lt;include&gt;&gt;</text>
  <path d="M835 340H875V188H930M835 465H930V348M835 465H890V668H930M835 590H905V188H930M835 590H890V508H930M835 590H875V668H930" class="include"/>
  <rect x="270" y="780" width="470" height="92" rx="10" class="note"/>
  <text x="292" y="810" class="head">Privacy and integrity note</text>
  <text x="292" y="834" class="small">Favourites are browser-only. Payment-card fields never flow to the API or repository.</text>
  <text x="292" y="854" class="small">The API authorises role and validates quantity/capacity before it persists a booking.</text>
</svg>
